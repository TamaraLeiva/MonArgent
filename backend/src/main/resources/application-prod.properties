# Perfil de producción (requiere configuración explícita)
spring.config.activate.on-profile=prod

# Base de datos (sin defaults inseguros; validadas al arranque en prod)
# SPRING_DATASOURCE_URL debe incluir host, puerto, DB y parámetros TLS requeridos por Enzonic.
# No inventar parámetros TLS: obtener formato exacto del panel/documentación oficial de Enzonic.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate (prod seguro)
# Con Flyway activo, Hibernate solo valida el esquema.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway (inicialización controlada de esquema en DB vacía)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.validate-on-migrate=true

# Migración legacy de esquema deshabilitada en prod (Flyway + Hibernate validate).
app.schema.legacy-migration.enabled=false

# Swagger deshabilitado en prod
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# CORS prod: orígenes exactos, configurables por env
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
app.frontend.url=${APP_FRONTEND_URL:}

# Logging prod
logging.level.com.monargent=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Nunca exponer códigos en prod
app.auth.expose-codes-in-log=false

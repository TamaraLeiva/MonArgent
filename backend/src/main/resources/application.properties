# ===================================================================
# External Env Configuration
# ===================================================================
spring.config.import=optional:file:./.env[.properties],optional:file:backend/.env[.properties]

# ===================================================================
# Profile default (dev) - prod debe activarse explícitamente
# ===================================================================
spring.profiles.default=dev

# ===================================================================
# Server Configuration
# ===================================================================
server.port=${PORT:8080}
server.servlet.context-path=/api/v1
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# ===================================================================
# Jackson / JSON Serialization
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=${APP_TIMEZONE:America/Argentina/Buenos_Aires}

# ===================================================================
# Flyway (por defecto desactivado; prod lo habilita explícitamente)
# ===================================================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# ===================================================================
# Legacy schema migration (deshabilitada por defecto; Flyway es la fuente de verdad)
# ===================================================================
app.schema.legacy-migration.enabled=false

# ===================================================================
# Database Configuration (común)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool HikariCP conservador (ajustable por env; importante para planes gratuitos)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME_MS:300000}

# ===================================================================
# JPA / Hibernate Configuration (común)
# ===================================================================
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:America/Argentina/Buenos_Aires}

# ===================================================================
# Mail Configuration (opcional: no bloquear arranque si no se configura)
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${MAIL_FROM:${MAIL_USERNAME:noreply@monargent.app}}

# ===================================================================
# App Base URL (para links de email)
# ===================================================================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# ===================================================================
# CORS (base; perfiles afinan comportamiento)
# ===================================================================
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# ===================================================================
# JWT Configuration
# ===================================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Auth hardening
# ===================================================================
# Nunca habilitar en producción. En dev/test solo si se activa explícitamente.
app.auth.expose-codes-in-log=${APP_AUTH_EXPOSE_CODES_IN_LOG:false}

# Rate limiting en memoria (single-instance). Requiere almacén compartido para multi-instancia.
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.ip.auth.max=${APP_RATE_LIMIT_IP_AUTH_MAX:20}
app.rate-limit.ip.auth.window-seconds=${APP_RATE_LIMIT_IP_AUTH_WINDOW_SECONDS:900}
app.rate-limit.ip.public.max=${APP_RATE_LIMIT_IP_PUBLIC_MAX:20}
app.rate-limit.ip.public.window-seconds=${APP_RATE_LIMIT_IP_PUBLIC_WINDOW_SECONDS:900}
app.rate-limit.account.auth.max=${APP_RATE_LIMIT_ACCOUNT_AUTH_MAX:10}
app.rate-limit.account.auth.window-seconds=${APP_RATE_LIMIT_ACCOUNT_AUTH_WINDOW_SECONDS:900}

# ===================================================================
# Seed usuario de prueba (SOLO desarrollo, default false)
# ===================================================================
app.seed-test-user=${APP_SEED_TEST_USER:false}

# ===================================================================
# Límite de archivos (importación/OCR)
# ===================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===================================================================
# OCR.Space Configuration (opcional)
# ===================================================================
ocr.api-key=${OCR_API_KEY:}
ocr.base-url=https://api.ocr.space/parse/image
ocr.preprocess-max-bytes=${OCR_PREPROCESS_MAX_BYTES:1048576}

# ===================================================================
# Gemini Configuration (opcional)
# ===================================================================
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}

# ===================================================================
# Zona horaria de aplicación/schedulers
# ===================================================================
app.timezone=${APP_TIMEZONE:America/Argentina/Buenos_Aires}

# ===================================================================
# Archivos / comprobantes
# ===================================================================
app.settlement-proof-dir=${SETTLEMENT_PROOF_DIR:uploads/settlement-proofs}

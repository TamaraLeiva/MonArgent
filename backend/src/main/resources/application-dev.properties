# Perfil de desarrollo local (predeterminado)
spring.config.activate.on-profile=dev

# Base de datos local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/monargent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA / Hibernate (dev)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway desactivado por defecto en dev para no afectar DB locales existentes.
# Activar explícitamente con FLYWAY_ENABLED=true cuando se quiera validar migraciones.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Migración legacy de esquema deshabilitada por defecto (Flyway es la fuente de verdad).
app.schema.legacy-migration.enabled=false

# Swagger habilitado en dev
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# CORS dev (localhost + herramientas locales)
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app,https://*.ngrok-free.dev,https://*.ngrok-free.app}

# Logging dev
logging.level.com.monargent=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:WARN}

# Códigos de auth en log solo si se habilita explícitamente
app.auth.expose-codes-in-log=${APP_AUTH_EXPOSE_CODES_IN_LOG:false}
